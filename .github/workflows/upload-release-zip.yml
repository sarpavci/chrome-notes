name: upload-release-zip

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  upload-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run zip

      - run: gh release upload "${{ github.event.release.tag_name }}" .output/*-chrome.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
